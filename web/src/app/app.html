<header class="topbar">
  <h1>WindOps Control Center</h1>
  <nav class="main-nav" aria-label="Navegação principal">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Painel</a
    >
    <a routerLink="/assets" routerLinkActive="active">Ativos</a>
    <a routerLink="/alerts" routerLinkActive="active">Alertas</a>
  </nav>
  <button
    type="button"
    class="health"
    (click)="refreshHealth()"
    aria-label="Verificar disponibilidade da API WindOps"
  >
    <span class="dot" [class]="healthStatus()"></span>
    <span role="status" aria-live="polite">
      API
      @if (healthStatus() === 'checking') {
        Verificando…
      } @else if (healthStatus() === 'online') {
        Online
      } @else {
        Indisponível
      }
    </span>
  </button>
</header>

<main>
  <router-outlet />
</main>
